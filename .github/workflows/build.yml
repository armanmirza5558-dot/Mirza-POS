name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      # Yeh naya step Flutter ko naya project banane ka bolega
      - name: Create Flutter Project
        run: flutter create --project-name pos_app --org com.myshop my_app
        
      # Hamari files us naye project mein copy karega
      - name: Copy files
        run: |
          cp pubspec.yaml my_app/pubspec.yaml
          cp -r lib/* my_app/lib/
          
      # Ab us naye project ke andar jaakar APK build karega
      - name: Build APK
        run: |
          cd my_app
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
